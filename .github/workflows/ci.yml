name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The claim on the tin is "attaches to a process that is already running".
  # Prove it on every push rather than trusting the README.
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: profile a live node process
        run: |
          cat > /tmp/spin.js <<'JS'
          // The result has to be observable, or V8 eliminates the whole loop as
          // dead code and the profile ends up showing nothing but timers.
          let sink = 0;
          function hot() { let h = 0; for (let i = 0; i < 5e6; i++) h = (h * 31 + i) >>> 0; return h; }
          setInterval(() => { sink = (sink + hot()) >>> 0; }, 1);
          process.on("exit", () => console.log("sink", sink));
          JS
          node /tmp/spin.js & echo $! > /tmp/pid
          sleep 2
          ./target/release/flare "$(cat /tmp/pid)" -d 5 --json --no-html > /tmp/out.json
          cat /tmp/out.json
          # The workload is one hot function; it must top the ranking.
          node -e '
            const r = require("/tmp/out.json");
            if (!r.hot_functions?.length) { console.error("no functions captured"); process.exit(1); }
            if (r.sampled_ms < 3000) { console.error("suspiciously short sample", r.sampled_ms); process.exit(1); }

            // Assert on *location*, not function name. V8 inlines hot() into its
            // caller often enough that the name lands on "(top level)" instead —
            // that is V8 deciding where the frame is, not flare getting it wrong.
            // What flare must get right is that the time is attributed to the
            // workload file and that it dominates.
            const top = r.hot_functions[0];
            if (!top.location.startsWith("spin.js")) {
              console.error("expected the workload on top, got", top.function, top.location);
              process.exit(1);
            }
            if (top.self_pct < 80) {
              console.error("workload should dominate, got", top.self_pct + "%"); process.exit(1);
            }
            if (!r.hot_path.some(f => f.includes("spin.js"))) {
              console.error("workload missing from hot_path", r.hot_path); process.exit(1);
            }
            console.log("ok —", top.function, "@", top.location, "at", top.self_pct + "%");
          '
          kill "$(cat /tmp/pid)"
