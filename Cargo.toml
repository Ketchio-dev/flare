[package]
name = "flare"
version = "0.1.0"
edition = "2021"
description = "Attach to any running JavaScript process and get a flamegraph. One command, no restart, no code changes."
license = "MIT"

[dependencies]
tungstenite = "0.24"
ureq = "2"
serde_json = "1"
nix = { version = "0.29", features = ["signal"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
